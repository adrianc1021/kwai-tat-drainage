{% extends 'portal/base.html' %}{% block title %}通渠小知識{% endblock %}{% block content %}<main class="public-blog"><p class="eyebrow">快達通渠 · 通渠小知識</p><h1>先了解，再安排</h1><div class="public-blog-grid">{% for post in posts %}<article class="card"><h2><a href="/blog/{{ post.slug }}/">{{ post.title }}</a></h2><p class="muted">{{ post.excerpt }}</p><small>{{ post.published_at|date:'d/m/Y' }}</small></article>{% empty %}<section class="card empty-state"><h2>文章正在準備</h2><p>管理員發布文章後，這裏會顯示實用的通渠及排水資訊。</p></section>{% endfor %}</div></main>{% endblock %}
