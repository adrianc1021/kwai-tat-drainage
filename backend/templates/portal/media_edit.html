{% extends 'portal/base.html' %}{% block title %}編輯圖片資料{% endblock %}{% block content %}<div class="heading"><div><p class="eyebrow">圖片庫 ／ {{ asset.title }}</p><h1>編輯圖片資料</h1><p class="muted">修正名稱、替代文字、說明和標籤，不會改變原圖檔案。</p></div><a class="button light" href="/manage/media/">返回圖片庫</a></div><div class="two-col"><section class="card"><img class="media-edit-preview" src="/media/{{ asset.pk }}.webp" alt="{{ asset.alt }}" width="{{ asset.width }}" height="{{ asset.height }}"><p class="muted">{{ asset.width }} × {{ asset.height }} · {{ asset.size|filesizeformat }}</p></section><section class="card"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="button">儲存圖片資料</button></form></section></div>{% endblock %}
