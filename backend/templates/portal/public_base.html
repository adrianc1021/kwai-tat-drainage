<!doctype html><html lang="zh-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ seo_title }}</title><meta name="description" content="{{ seo_description }}">
<meta name="robots" content="{{ robots }}"><link rel="canonical" href="{{ canonical }}">
<meta property="og:title" content="{{ og_title }}"><meta property="og:description" content="{{ og_description }}">
<meta property="og:url" content="{{ canonical }}"><meta property="og:locale" content="zh_HK">
<meta property="og:site_name" content="快達通渠"><meta property="og:type" content="{% if post %}article{% else %}website{% endif %}">
<meta property="og:image" content="{{ og_image }}"><meta name="twitter:card" content="summary">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/portal/admin.css">
{% if article_schema %}<script type="application/ld+json">{{ article_schema|safe }}</script>{% endif %}
</head><body><a class="skip" href="#main">跳至主要內容</a>
<header class="topbar"><a href="/">快達通渠</a><nav aria-label="主要導航"><a href="/services.html">通渠服務</a> · <a href="/blog/">通渠文章</a> · <a href="/contact.html">聯絡查詢</a></nav></header>
{% block content %}{% endblock %}<footer><a href="/">快達通渠首頁</a> · <a href="/privacy.html">私隱說明</a></footer></body></html>
