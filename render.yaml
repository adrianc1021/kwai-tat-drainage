services:
  - type: web
    name: kwai-tat-drainage-cms
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && python3 production/build.py --public && CMS_DATA_DIR=/tmp/cms-build CMS_PRODUCTION=1 python3 backend/manage.py collectstatic --noinput"
    startCommand: "python3 backend/manage.py migrate && python3 backend/manage.py init_cms && python3 backend/manage.py bootstrap_admin && gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -"
    healthCheckPath: /
    pullRequestPreviewsEnabled: false
    disk:
      name: cms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SITE_URL
        sync: false
      - key: SITE_PHONE
        sync: false
      - key: SITE_WHATSAPP
        sync: false
      - key: PUBLISH_CONFIRMED
        sync: false
      - key: CMS_PRODUCTION
        value: "1"
      - key: CMS_ALLOWED_HOSTS
        value: "kwai-tat-drainage.onrender.com"
      - key: CMS_DATA_DIR
        value: "/var/data"
      - key: CMS_ADMIN_USERNAME
        sync: false
      - key: CMS_ADMIN_PASSWORD
        sync: false
